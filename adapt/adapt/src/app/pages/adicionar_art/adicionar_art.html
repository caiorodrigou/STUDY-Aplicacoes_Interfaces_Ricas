<div class="min-h-screen pb-12">
  <header class="mx-auto max-w-7xl px-6 pt-10 pb-6 lg:px-10">
    <p class="mb-4 text-sm font-semibold tracking-[0.25em] text-sunny uppercase">
      Compilation · Obras &amp; Acervo · 2026
    </p>

    <div class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
      <h1 class="font-display text-5xl font-bold leading-tight tracking-tight text-ink sm:text-7xl lg:text-8xl">
        <span class="block">Galeria de Artes</span>
      </h1>

      <p class="max-w-md text-base leading-relaxed text-ink-soft lg:pb-2">
        Inclua novas obras, explore o acervo e gerencie cada peça do seu portfólio.
      </p>
    </div>

    <div class="mt-6 h-px w-full bg-line"></div>
  </header>

  <main class="mx-auto grid max-w-7xl gap-6 px-6 lg:grid-cols-[minmax(19rem,22rem)_1fr] lg:items-stretch lg:gap-8 lg:px-10">
    <aside class="flex min-h-0 flex-col">
      <artwork-incluir (arteCriada)="adicionarArte($event)" />
    </aside>

    <section class="flex min-h-[32rem] flex-col lg:min-h-0">
      <artwork-listar
        class="block h-full min-h-[32rem] lg:min-h-full"
        [artworks]="artworks()"
        (detalhar)="abrirDetalhe($event)"
        (alterar)="abrirAlterar($event)"
        (excluir)="excluirObra($event)"
      />
    </section>
  </main>
</div>

<p-dialog
  header="Detalhes da Obra"
  [visible]="exibirDetalhe()"
  (visibleChange)="exibirDetalhe.set($event)"
  [modal]="true"
  [style]="{ width: '32rem' }"
  styleClass="galeria-dialog"
>
  @if (obraSelecionada(); as obra) {
    <artwork-detalhar [obra]="obra" />
  }
</p-dialog>

<p-dialog
  header="Alterar Obra"
  [visible]="exibirAlterar()"
  (visibleChange)="exibirAlterar.set($event)"
  [modal]="true"
  [style]="{ width: '28rem' }"
  styleClass="galeria-dialog"
>
  @if (exibirAlterar()) {
    <artwork-alterar
      [(obra)]="obraEdicao"
      (salvar)="confirmarAlteracao($event)"
      (cancelar)="cancelarAlteracao()"
    />
  }
</p-dialog>
