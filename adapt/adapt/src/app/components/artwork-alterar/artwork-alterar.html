<div class="flex flex-col gap-5">
  <div class="flex flex-col gap-2">
    <label class="alterar-label">Descrição</label>
    <input pInputText [(ngModel)]="descricao" placeholder="Ex: Noite Estrelada..." class="alterar-input" />
  </div>

  <div class="flex flex-col gap-2">
    <label class="alterar-label">URL da imagem</label>
    <input pInputText type="url" [(ngModel)]="img" placeholder="https://..." class="alterar-input" />
  </div>

  <div class="flex flex-col gap-2">
    <label class="alterar-label">Estilo</label>
    <p-select
      [options]="opcoesTipoArt"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="tipoArt"
      appendTo="body"
      class="w-full"
      styleClass="alterar-select w-full rounded-xl! border-2! border-ink! bg-white!"
      panelStyleClass="alterar-select-panel"
    />
  </div>

  <div class="flex items-center gap-3 rounded-xl border border-line bg-white p-3">
    <p-checkbox
      [(ngModel)]="privado"
      [binary]="true"
      inputId="privado-alterar"
      styleClass="alterar-checkbox"
    />
    <label for="privado-alterar" class="cursor-pointer text-sm font-medium text-ink select-none">Obra privada</label>
  </div>

  <div class="flex justify-end gap-3 border-t-2 border-line pt-4">
    <p-button label="Cancelar" styleClass="alterar-btn-ghost!" (onClick)="onCancelar()" />
    <p-button label="Salvar" icon="pi pi-check" styleClass="alterar-btn-primary!" (onClick)="onSalvar()" />
  </div>
</div>
