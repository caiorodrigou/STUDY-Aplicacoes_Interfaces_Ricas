<div class="flex flex-col gap-4 mt-2">
  <div class="flex flex-col gap-2">
    <label class="font-semibold !text-slate-300 ml-1">Descrição da Obra</label>
    <input
      pInputText
      [(ngModel)]="descricao"
      placeholder="Ex: Noite Estrelada..."
      class="!bg-slate-950 !text-slate-100 !border-slate-700 focus:!border-cyan-500 rounded-lg w-full"
    />
  </div>

  <div class="flex flex-col gap-2">
    <label class="font-semibold !text-slate-300 ml-1">URL da Imagem</label>
    <input
      pInputText
      type="url"
      [(ngModel)]="img"
      placeholder="https://link-da-imagem.com"
      class="!bg-slate-950 !text-slate-100 !border-slate-700 focus:!border-cyan-500 rounded-lg w-full"
    />
  </div>

  <div class="flex flex-col gap-2">
    <label class="font-semibold !text-slate-300 ml-1">Estilo Artístico</label>
    <p-select
      [options]="opcoesTipoArt"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="tipoArt"
      appendTo="body"
      class="w-full"
      styleClass="!bg-slate-950 !text-slate-100 !border-slate-700 rounded-lg"
    />
  </div>

  <div class="flex items-center gap-3 bg-slate-950/40 p-3 rounded-lg border border-slate-800">
    <p-checkbox [(ngModel)]="privado" [binary]="true" inputId="privado-alterar" />
    <label for="privado-alterar" class="cursor-pointer !text-slate-300 select-none">Obra privada?</label>
  </div>

  <div class="flex justify-end gap-3 pt-2">
    <p-button label="Cancelar" [text]="true" styleClass="!text-slate-400" (onClick)="onCancelar()" />
    <p-button
      label="Salvar alterações"
      icon="pi pi-check"
      styleClass="!bg-cyan-500 !border-none !text-slate-950 font-bold"
      (onClick)="onSalvar()"
    />
  </div>
</div>
