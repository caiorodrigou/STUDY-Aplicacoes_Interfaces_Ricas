<div class="flex h-full min-h-[32rem] w-full flex-col lg:min-h-full">
  <div class="listar-card flex h-full min-h-[32rem] flex-col overflow-hidden bg-white p-5 sm:p-6 lg:min-h-full">
    <div class="mb-4 flex shrink-0 flex-col gap-4 border-b border-line pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <span class="listar-label">Acervo</span>
        <div class="flex flex-wrap items-center gap-3 mt-1">
          <h2 class="font-display text-2xl font-bold text-ink sm:text-3xl">Suas obras</h2>
          <p-button 
            label="Nova Obra" 
            icon="pi pi-plus" 
            severity="success"
            [outlined]="true"
            size="small"
            styleClass="rounded-xl!"
            (onClick)="irParaInclusao()" 
          />
        </div>
        <p class="mt-1 text-sm font-medium text-muted">{{ artworks().length }} peça(s) cadastrada(s)</p>
      </div>

      <p-iconfield iconPosition="left" class="w-full shrink-0 sm:w-64">
        <p-inputicon class="pi pi-search text-muted!" />
        <input
          pInputText
          type="text"
          (input)="dt.filterGlobal($any($event.target).value, 'contains')"
          placeholder="Buscar..."
          class="listar-input pl-10!"
        />
      </p-iconfield>
    </div>

    <div class="listar-table-scroll min-h-0 flex-1 rounded-xl border border-line bg-white">
      <p-table
        #dt
        [value]="artworks()"
        dataKey="id"
        [paginator]="true"
        [rows]="4"
        [rowsPerPageOptions]="[4, 8, 12]"
        [scrollable]="true"
        scrollHeight="flex"
        [responsiveLayout]="'scroll'"
        styleClass="listar-table listar-table-light h-full w-full"
      >
        <ng-template pTemplate="header">
          <tr>
            <th class="bg-white! py-3 text-left text-[10px] font-bold tracking-widest text-ink-soft uppercase">Preview</th>
            <th class="bg-white! py-3 text-left text-[10px] font-bold tracking-widest text-ink-soft uppercase" pSortableColumn="descricao">
              Descrição <p-sortIcon field="descricao" />
            </th>
            <th class="bg-white! py-3 text-left text-[10px] font-bold tracking-widest text-ink-soft uppercase" pSortableColumn="tipoArt">
              Estilo <p-sortIcon field="tipoArt" />
            </th>
            <th class="bg-white! py-3 text-left text-[10px] font-bold tracking-widest text-ink-soft uppercase">Status</th>
            <th class="bg-white! py-3 text-right text-[10px] font-bold tracking-widest text-ink-soft uppercase">Ações</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-art>
          <tr class="group bg-white transition-colors hover:bg-canvas-warm">
            <td class="bg-white! py-3 group-hover:bg-canvas-warm!">
              <img
                [src]="art.img"
                [alt]="art.descricao"
                class="h-14 w-14 rounded-xl border border-line object-cover transition-transform group-hover:scale-105"
              />
            </td>
            <td class="bg-white! py-3 font-medium text-ink group-hover:bg-canvas-warm!">{{ art.descricao }}</td>
            <td class="bg-white! py-3 group-hover:bg-canvas-warm!">
              <p-tag [value]="art.tipoArt" styleClass="listar-tag" />
            </td>
            <td class="bg-white! py-3 group-hover:bg-canvas-warm!">
              <span
                class="inline-flex items-center gap-1 rounded-lg border border-line bg-white px-2.5 py-0.5 text-xs font-semibold"
                [ngClass]="art.privado ? 'text-rose-700' : 'text-emerald-700'"
              >
                <i class="pi text-[10px]" [ngClass]="art.privado ? 'pi-lock' : 'pi-globe'"></i>
                {{ art.privado ? 'Privado' : 'Público' }}
              </span>
            </td>
            <td class="bg-white! py-3 text-right group-hover:bg-canvas-warm!">
              <div class="inline-flex gap-0.5">
                <p-button
                  icon="pi pi-eye"
                  [rounded]="true"
                  [text]="true"
                  styleClass="rounded-full! text-ink! hover:bg-sunny-light!"
                  (onClick)="irParaDetalhe(art.id)"
                  ariaLabel="Detalhar"
                />
                <p-button
                  icon="pi pi-pencil"
                  [rounded]="true"
                  [text]="true"
                  styleClass="rounded-full! text-sunny-dark! hover:bg-sunny-light!"
                  (onClick)="irParaAtualizacao(art.id)"
                  ariaLabel="Alterar"
                />
                <p-button
                  icon="pi pi-trash"
                  [rounded]="true"
                  [text]="true"
                  styleClass="rounded-full! text-rose-600! hover:bg-rose-50!"
                  (onClick)="onExcluir(art.id)"
                  ariaLabel="Excluir"
                />
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="bg-white! py-12 text-center">
              <p class="font-display text-lg font-bold text-ink">Nenhuma obra ainda</p>
              <p class="mt-1 text-sm text-muted">Clique em "Nova Obra" acima para publicar sua primeira peça.</p>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
